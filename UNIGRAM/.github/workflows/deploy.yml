name: CI/CD Pipeline

on:
  push:
    branches: [ main, optimized, master ]
  pull_request:
    branches: [ main, optimized, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Run unit tests
        run: |
          npm run test:unit

      - name: Build application
        run: |
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps

      - name: Run E2E tests
        run: |
          npm run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_TEST_USER_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_USER_EMAIL }}
          PLAYWRIGHT_TEST_USER_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_USER_PASSWORD }}

  deploy-staging:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/optimized' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Trigger Staging Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/optimized' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Trigger Production Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}"
